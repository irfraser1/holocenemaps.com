name: QA

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  smoke-tests:
    name: Smoke tests
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run smoke tests
        run: npm test
